name: Gate
description: >-
  The checks every workflow runs, in one place, one command to a step. Held
  here rather than repeated per workflow so that adding a check adds it
  everywhere at once, and a pull request, a push to main and a tag cannot
  drift into answering different questions.

runs:
  using: composite
  steps:
    # The version comes from `.tool-versions`, so the runner and whoever runs
    # `npm run precommit` are on the same Node rather than on whatever each
    # happened to have. asdf and mise read the same file.
    - uses: actions/setup-node@v4
      with:
        node-version-file: .tool-versions
        cache: npm

    - name: Install dependencies
      id: install
      run: npm ci
      shell: bash

    # Each step calls the npm script that defines it, so the commands live in
    # package.json and what this holds is only the order. A failure names
    # which check failed in the run's own list, and any step here can be
    # lifted into a job of its own later.
    #
    # It is the same list `npm run precommit` runs by hand, minus the writing:
    # CI reads and reports, it does not reformat a branch on its author's
    # behalf, and it is told to leave the coverage floors alone.
    #
    # Each carries the same condition so that one failing check does not hide
    # the others: a commit with both a formatting slip and a failing test
    # should hear about both from one run rather than over two pushes. The
    # `install` half stops that from turning a failed `npm ci` into four more
    # failures saying the same thing — without a `node_modules` there is
    # nothing any of them could report.
    - name: Format
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npm run format:check
      shell: bash

    - name: Type check
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npm run typecheck
      shell: bash

    - name: Bundle
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npm run bundle
      shell: bash

    - name: Test
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false
      shell: bash
