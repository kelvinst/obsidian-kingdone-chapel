name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same checks a pull request answers, in the same order and one to a
      # step: a tag is the last chance to catch something, and building alone
      # would have published a bundle the suite rejects. `Bundle` is what
      # writes the `main.js` the release carries.
      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Bundle
        run: npm run bundle

      - name: Test
        run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest.json version $manifest_version" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
