name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    # A push carries no pull request, so the draft field it would be filtered
    # by does not exist there.
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run check` spelled out one command to a step, rather than run as
      # itself, so that a failure names which check failed in the run's own
      # list and any step here can be lifted into a job of its own later. Each
      # calls the script that defines it, so the commands live in one place;
      # what CI holds is only the order.
      #
      # This is the same list the pre-commit hook runs, minus the writing: CI
      # reads and reports, it does not reformat a branch on its author's
      # behalf, and it is told to leave the coverage floors where they are.
      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Bundle
        run: npm run bundle

      - name: Test
        run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false
