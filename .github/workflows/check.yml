name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A pull request is only ever asked about its latest commit, so a run the next
# push has already overtaken is worth cancelling. Commits on `main` are not
# like that — each one is answered for on its own — which is why they are a
# workflow of their own rather than another trigger here.
concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gate
