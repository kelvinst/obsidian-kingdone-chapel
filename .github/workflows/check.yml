name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A pull request is only ever asked about its latest commit, so a run the next
# push has already overtaken is worth cancelling. Commits on `main` are not
# like that — each one is answered for on its own — which is why they are a
# workflow of their own rather than another trigger here.
concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The gate, one command to a step rather than one script, so that a
      # failure names which check failed in the run's own list and any step
      # here can be lifted into a job of its own later. Each calls the npm
      # script that defines it, so the commands live in one place and what a
      # workflow holds is only the order.
      #
      # It is the same list `npm run precommit` runs by hand, minus the
      # writing: CI reads and reports, it does not reformat a branch on its
      # author's behalf, and it is told to leave the coverage floors alone.
      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Bundle
        run: npm run bundle

      - name: Test
        run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false
