name: Main

on:
  push:
    branches: [main]

# No `concurrency` here, deliberately. Every commit on `main` is answered for
# on its own, and a group that cancels would drop exactly the commits this
# workflow exists to cover: merge two pull requests a minute apart and the
# first merge's run would be cancelled by the second, leaving that commit with
# neither a green nor a red against it. Pull requests are the opposite case and
# are cancelled on purpose, in `check.yml`.

permissions:
  contents: read

jobs:
  main:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gate
